<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saputra Agung 🌀</title>
<style>
:root{--bg:#0f2430;--surface:#16394a;--ink:#eaf4f2;--muted:#9bbcc0;--accent:#f2b84b;--line:#2d6076;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e9f1ef;--surface:#ffffff;--ink:#12303d;--muted:#4c6b72;--accent:#b36b00;--line:#9ec0c4}}
:root[data-theme="light"]{--bg:#e9f1ef;--surface:#ffffff;--ink:#12303d;--muted:#4c6b72;--accent:#b36b00;--line:#9ec0c4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.6}
main{max-width:720px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:2rem;margin:.2em 0}
h1 span{display:inline-block;animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){h1 span{animation:none}}
.sub{color:var(--muted);margin:0 0 20px}
section{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
h2{font-size:1.15rem;margin:0 0 10px}
label{display:block;margin:10px 0 4px;color:var(--muted);font-size:.9rem}
input,select,button{font:inherit;width:100%;padding:10px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button{background:var(--accent);color:#1a1a1a;border:0;font-weight:bold;margin-top:12px;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.msg{min-height:1.4em;margin-top:8px;font-size:.95rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{font-size:2.2rem;font-weight:bold;color:var(--accent)}
.compass{width:140px;height:140px;margin:0 auto;display:block}
.rect{border:2px solid var(--accent);border-radius:4px;padding:14px;display:flex;gap:16px;align-items:center}
.rect .num{font-size:3rem;font-weight:bold;color:var(--accent);line-height:1}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>Saputra Agung <span>🌀</span></h1>
<p class="sub">Masuk, lalu lihat cuaca, waktu, dan arah dalam satu halaman.</p>

<section id="loginBox">
<h2>Masuk</h2>
<label for="u">Nama pengguna</label>
<input id="u" autocomplete="username" value="">
<label for="p">Kata sandi</label>
<input id="p" type="password" autocomplete="current-password">
<button id="loginBtn" type="button">Masuk</button>
<div class="msg" id="loginMsg" aria-live="polite"></div>
<p class="sub" style="font-size:.85rem;margin:8px 0 0">Mode demo di browser: pengguna <b>saputra</b>, sandi <b>agung123</b>. Ini bukan autentikasi server asli.</p>
</section>

<div id="dash" class="hide">
<section>
<h2>Cuaca, waktu, dan arah</h2>
<div class="grid">
<div><div class="big" id="clock">--:--:--</div><div id="date" class="sub"></div></div>
<svg class="compass" viewBox="0 0 140 140" role="img" aria-label="Kompas arah">
<circle cx="70" cy="70" r="64" fill="none" stroke="var(--line)" stroke-width="3"/>
<text x="70" y="22" text-anchor="middle" fill="var(--ink)" font-size="14">U</text>
<text x="124" y="75" text-anchor="middle" fill="var(--ink)" font-size="14">T</text>
<text x="70" y="128" text-anchor="middle" fill="var(--ink)" font-size="14">S</text>
<text x="16" y="75" text-anchor="middle" fill="var(--ink)" font-size="14">B</text>
<g id="needle" style="transform-origin:70px 70px;transition:transform .8s"><polygon points="70,26 77,70 63,70" fill="var(--accent)"/><polygon points="70,114 77,70 63,70" fill="var(--line)"/></g>
</svg>
</div>
<label for="w">Kondisi cuaca</label>
<select id="w">
<option value="cerah">Cerah</option><option value="berawan">Berawan</option><option value="hujan">Hujan</option><option value="berangin">Berangin</option>
</select>
<label for="dir">Arah angin</label>
<select id="dir">
<option value="0">Utara</option><option value="45">Timur Laut</option><option value="90">Timur</option><option value="135">Tenggara</option><option value="180">Selatan</option><option value="225">Barat Daya</option><option value="270">Barat</option><option value="315">Barat Laut</option>
</select>
</section>

<section>
<h2>Gabungan</h2>
<div class="rect">
<div class="num">1</div>
<p id="para" style="margin:0"></p>
</div>
</section>
<button id="logout" type="button">Keluar</button>
</div>
</main>
<script>
(function(){
var names={0:"Utara",45:"Timur Laut",90:"Timur",135:"Tenggara",180:"Selatan",225:"Barat Daya",270:"Barat",315:"Barat Laut"};
var $=function(i){return document.getElementById(i)};
function sapa(h){return h<11?"pagi":h<15?"siang":h<18?"sore":"malam"}
function tick(){
var d=new Date();
$("clock").textContent=d.toLocaleTimeString("id-ID");
$("date").textContent=d.toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
var w=$("w").value,deg=$("dir").value;
$("needle").style.transform="rotate("+deg+"deg)";
$("para").textContent="Selamat "+sapa(d.getHours())+", "+($("u").value||"pengguna")+". Cuaca "+w+" dengan arah angin ke "+names[deg]+". Pukul "+d.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"})+" adalah waktu untuk menentukan langkah berikutnya.";
}
setInterval(tick,1000);
$("w").onchange=tick;$("dir").onchange=tick;
$("loginBtn").onclick=function(){
if($("u").value.trim()==="saputra"&&$("p").value==="agung123"){
$("loginBox").classList.add("hide");$("dash").classList.remove("hide");tick();
}else{$("loginMsg").textContent="Nama pengguna atau kata sandi salah. Periksa lalu coba lagi."}
};
$("logout").onclick=function(){$("dash").classList.add("hide");$("loginBox").classList.remove("hide");$("p").value="";$("loginMsg").textContent=""};
})();
</script>
</body>
</html>
